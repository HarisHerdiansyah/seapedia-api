info:
  name: 02-register-admin
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/{{AUTH_MODULE}}/register"
  body:
    type: json
    data: |-
      {
        "username": "seapedia admin",
        "email": "seapedia_admin01@gmail.com",
        "password": "Admin#1234",
        "role": "ADMIN"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 201 Created", function() {
          expect(res.getStatus()).to.equal(201);
        });

        test("success is true", function() {
          expect(res.getBody().success).to.equal(true);
        });

        test("role is ADMIN", function() {
          expect(res.getBody().data.role).to.equal("ADMIN");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
