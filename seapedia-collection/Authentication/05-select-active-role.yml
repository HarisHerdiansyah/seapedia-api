info:
  name: 05-select-active-role
  type: http
  seq: 5

http:
  method: POST
  url: "{{BASE_URL}}/{{AUTH_MODULE}}/non-admin-role"
  body:
    type: json
    data: |-
      {
        "activeRole": "BUYER"
      }
  auth: inherit

runtime:
  tests: |-
    test("Status is 200 OK", function() {
      expect(res.getStatus()).to.equal(200);
    });
    test("success is true", function() {
      expect(res.getBody().success).to.equal(true);
    });
    test("message is correct", function() {
      expect(res.getBody().message).to.equal("Active role updated successfully.");
    });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
