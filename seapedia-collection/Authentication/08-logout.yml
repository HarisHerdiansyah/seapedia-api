info:
  name: 08-logout
  type: http
  seq: 8

http:
  method: POST
  url: "{{BASE_URL}}/{{AUTH_MODULE}}/logout"
  auth: inherit

runtime:
  scripts:
    - type: post-response
      code: |-
        if (res.getStatus() === 200) {
          bru.setEnvVar("ACCESS_TOKEN", "");
        }
    - type: tests
      code: |-
        test("Status is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("success is true", function() {
          expect(res.getBody().success).to.equal(true);
        });

        test("message is correct", function() {
          expect(res.getBody().message).to.equal("Logout successful.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
