info:
  name: 05-login-email-not-found
  type: http
  seq: 5

http:
  method: POST
  url: "{{BASE_URL}}/{{AUTH_MODULE}}/login"
  body:
    type: json
    data: |-
      {
        "email": "tidakada@example.com",
        "password": "Password1!"
      }
  auth: inherit

runtime:
  tests: |-
    test("Status is 401 Unauthorized", function() {
      expect(res.getStatus()).to.equal(401);
    });
    test("success is false", function() {
      expect(res.getBody().success).to.equal(false);
    });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
