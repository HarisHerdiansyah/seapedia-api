info:
  name: 04-login-wrong-password
  type: http
  seq: 4

http:
  method: POST
  url: "{{BASE_URL}}/{{AUTH_MODULE}}/login"
  body:
    type: json
    data: |-
      {
        "email": "testuser01@example.com",
        "password": "WrongPass1!"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 401 Unauthorized", function() {
          expect(res.getStatus()).to.equal(401);
        });

        test("success is false", function() {
          expect(res.getBody().success).to.equal(false);
        });

        test("message is Invalid email or password", function() {
          expect(res.getBody().message).to.equal("Invalid email or password.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
