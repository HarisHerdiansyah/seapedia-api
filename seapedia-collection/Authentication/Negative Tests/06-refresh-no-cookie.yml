info:
  name: 06-refresh-no-cookie
  type: http
  seq: 6

http:
  method: POST
  url: "{{BASE_URL}}/{{AUTH_MODULE}}/refresh-token"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 403 Forbidden", function() {
          expect(res.getStatus()).to.equal(403);
        });

        test("success is false", function() {
          expect(res.getBody().success).to.equal(false);
        });

        test("message is Refresh token is missing", function() {
          expect(res.getBody().message).to.equal("Refresh token is missing.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
