info:
  name: 02-register-username-duplicate
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/{{AUTH_MODULE}}/register"
  body:
    type: json
    data: |-
      {
        "username": "spring01",
        "email": "spring01@example.com",
        "password": "Password1!",
        "role": "NON_ADMIN"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 409 Conflict", function() {
          expect(res.getStatus()).to.equal(409);
        });

        test("success is false", function() {
          expect(res.getBody().success).to.equal(false);
        });

        test("message mentions username already exists", function() {
          expect(res.getBody().message).to.include("already exists");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
