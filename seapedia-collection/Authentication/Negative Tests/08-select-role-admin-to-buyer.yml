info:
  name: 08-select-role-admin-to-buyer
  type: http
  seq: 8

http:
  method: POST
  url: "{{BASE_URL}}/{{AUTH_MODULE}}/non-admin-role"
  body:
    type: json
    data: |-
      {
        "activeRole": "BUYER"
      }
  auth: inherit

runtime:
  tests: |-
    test("Status is 403 Forbidden", function() {
      expect(res.getStatus()).to.equal(403);
    });
    test("success is false", function() {
      expect(res.getBody().success).to.equal(false);
    });
    test("message mentions admin restriction", function() {
      expect(res.getBody().message).to.include("Admin users");
    });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
