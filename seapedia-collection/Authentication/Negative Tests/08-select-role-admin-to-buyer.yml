info:
  name: 08-select-role-admin-to-buyer
  type: http
  seq: 8

http:
  method: POST
  url: "{{BASE_URL}}/{{AUTH_MODULE}}/select-active-role"
  body:
    type: json
    data: |-
      {
        "activeRole": "BUYER"
      }
  auth:
    type: bearer
    token: "{{ACCESS_TOKEN}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 403 Forbidden", function() {
          expect(res.getStatus()).to.equal(403);
        });

        test("success is false", function() {
          expect(res.getBody().success).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
