info:
  name: 03-register-validation-failed
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/{{AUTH_MODULE}}/register"
  body:
    type: json
    data: |-
      {
        "username": "newuser99",
        "email": "newuser99@example.com",
        "password": "password1",
        "role": "NON_ADMIN"
      }
  auth: inherit

runtime:
  tests: |-
    test("Status is 400 Bad Request", function() {
      expect(res.getStatus()).to.equal(400);
    });
    test("success is false", function() {
      expect(res.getBody().success).to.equal(false);
    });
    test("message mentions password requirement", function() {
      expect(res.getBody().message).to.include("uppercase");
    });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
