info:
  name: 09-reset-password-email-not-found
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{BASE_URL}}/{{AUTH_MODULE}}/reset-password"
  body:
    type: json
    data: |-
      {
        "email": "tidakada@example.com",
        "newPassword": "NewPass1!"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 404 Not Found", function() {
          expect(res.getStatus()).to.equal(404);
        });

        test("success is false", function() {
          expect(res.getBody().success).to.equal(false);
        });

        test("message mentions not found", function() {
          expect(res.getBody().message).to.include("not found");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
