info:
  name: 07-select-role-non-admin-to-admin
  type: http
  seq: 7

http:
  method: POST
  url: "{{BASE_URL}}/{{AUTH_MODULE}}/non-admin-role"
  body:
    type: json
    data: |-
      {
        "activeRole": "ADMIN"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 403 Forbidden", function() {
          expect(res.getStatus()).to.equal(403);
        });

        test("success is false", function() {
          expect(res.getBody().success).to.equal(false);
        });

        test("message mentions non-admin restriction", function() {
          expect(res.getBody().message).to.include("Non-admin users");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
