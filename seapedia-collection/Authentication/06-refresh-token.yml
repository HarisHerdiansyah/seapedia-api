info:
  name: 06-refresh-token
  type: http
  seq: 6

http:
  method: POST
  url: "{{BASE_URL}}/{{AUTH_MODULE}}/refresh-token"
  auth: inherit

runtime:
  scripts:
    - type: post-response
      code: |-
        if (res.getStatus() === 200) {
          const token = res.getBody().data.accessToken;
          bru.setEnvVar("ACCESS_TOKEN", token);
        }
    - type: tests
      code: |-
        test("Status is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("New accessToken is present", function() {
          expect(res.getBody().data.accessToken).to.be.a("string").and.not.empty;
        });

        test("message is correct", function() {
          expect(res.getBody().message).to.equal("Token refreshed successfully.");
        });

        test("userData.allowedAs is an array", function() {
          expect(res.getBody().data.userData.allowedAs).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
