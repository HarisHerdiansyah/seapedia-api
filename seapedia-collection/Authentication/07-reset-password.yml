info:
  name: 07-reset-password
  type: http
  seq: 7

http:
  method: PATCH
  url: "{{BASE_URL}}/{{AUTH_MODULE}}/reset-password"
  body:
    type: json
    data: |-
      {
        "email": "testuser01@example.com",
        "newPassword": "NewPass1!"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("success is true", function() {
          expect(res.getBody().success).to.equal(true);
        });

        test("message is correct", function() {
          expect(res.getBody().message).to.equal("Password reset successful.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
