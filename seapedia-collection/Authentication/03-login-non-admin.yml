info:
  name: 03-login-non-admin
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/{{AUTH_MODULE}}/login"
  body:
    type: json
    data: |-
      {
        "email": "spring01@gmail.com",
        "password": "Nazhmi#16"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("success is true", function() {
          expect(res.getBody().success).to.equal(true);
        });

        test("accessToken is present in body", function() {
          expect(res.getBody().data.accessToken).to.be.a("string").and.not.empty;
        });

        test("userData contains id and role NON_ADMIN", function() {
          const userData = res.getBody().data.userData;
          expect(userData).to.have.property("id");
          expect(userData.role).to.equal("NON_ADMIN");
        });

        test("userData.allowedAs is an array containing BUYER", function() {
          const allowedAs = res.getBody().data.userData.allowedAs;
          expect(allowedAs).to.be.an("array");
          expect(allowedAs).to.include("BUYER");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
