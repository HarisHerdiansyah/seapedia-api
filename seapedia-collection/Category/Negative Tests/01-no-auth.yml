info:
  name: 01-no-auth
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/{{CATEGORY_MODULE}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 401 Unauthorized", function() {
          expect(res.getStatus()).to.equal(401);
        });

        test("success is false", function() {
          expect(res.getBody().success).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
