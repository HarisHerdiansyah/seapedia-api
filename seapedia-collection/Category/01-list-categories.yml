info:
  name: 01-list-categories
  type: http
  seq: 1

http:
  method: GET
  url: "{{BASE_URL}}/{{CATEGORY_MODULE}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("success is true", function() {
          expect(res.getBody().success).to.equal(true);
        });

        test("message is correct", function() {
          expect(res.getBody().message).to.equal("Category retrieved");
        });

        test("data is an array", function() {
          expect(res.getBody().data).to.be.an("array");
        });

        test("each category has id and name", function() {
          const data = res.getBody().data;
          if (data.length > 0) {
            expect(data[0]).to.have.property("id");
            expect(data[0]).to.have.property("name");
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
