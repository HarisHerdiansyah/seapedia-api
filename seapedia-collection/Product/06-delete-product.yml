info:
  name: 06-delete-product
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{BASE_URL}}/{{PRODUCT_MODULE}}/{{PRODUCT_ID}}"
  auth:
    type: bearer
    token: "{{ACCESS_TOKEN}}"

vars:
  pre-request:
    - name: PRODUCT_ID
      value: "YOUR_PRODUCT_ID_HERE"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("success is true", function() {
          expect(res.getBody().success).to.equal(true);
        });

        test("message is Product deleted", function() {
          expect(res.getBody().message).to.equal("Product deleted");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
