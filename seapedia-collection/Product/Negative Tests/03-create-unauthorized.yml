info:
  name: 03-create-unauthorized
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/{{PRODUCT_MODULE}}"
  body:
    type: json
    data: |-
      {
        "categoryId": "YOUR_CATEGORY_ID_HERE",
        "name": "Ikan Segar Berkualitas",
        "price": 50000.0,
        "stock": 100,
        "description": "Ikan segar ditangkap langsung dari laut lepas dengan kualitas terjamin dan bergizi."
      }
  auth:
    type: bearer
    token: "{{ACCESS_TOKEN}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 403 Forbidden", function() {
          expect(res.getStatus()).to.equal(403);
        });

        test("success is false", function() {
          expect(res.getBody().success).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
