info:
  name: 03-get-product-by-id
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/{{PRODUCT_MODULE}}/{{PRODUCT_ID}}"
  auth: inherit

runtime:
  variables:
    - name: PRODUCT_ID
      value: 91b69b9a-43be-40cf-bf14-971b9c228739
  scripts:
    - type: tests
      code: |-
        test("Status is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("success is true", function() {
          expect(res.getBody().success).to.equal(true);
        });

        test("data contains product detail", function() {
          const data = res.getBody().data;
          expect(data).to.have.property("id");
          expect(data).to.have.property("name");
          expect(data).to.have.property("description");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
