info:
  name: 02-list-products-filtered
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/{{PRODUCT_MODULE}}"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "10"
      type: query
    - name: order
      value: "PRICE_ASC"
      type: query
    - name: minPrice
      value: "10000"
      type: query
    - name: maxPrice
      value: "500000"
      type: query
  auth:
    type: bearer
    token: "{{ACCESS_TOKEN}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 200 OK", function() {
          expect(res.getStatus()).to.equal(200);
        });

        test("success is true", function() {
          expect(res.getBody().success).to.equal(true);
        });

        test("all products are within price range", function() {
          const products = res.getBody().data.productData;
          products.forEach(function(p) {
            expect(p.price).to.be.at.least(10000);
            expect(p.price).to.be.at.most(500000);
          });
        });

        test("products are sorted by price ascending", function() {
          const products = res.getBody().data.productData;
          for (var i = 1; i < products.length; i++) {
            expect(products[i].price).to.be.at.least(products[i-1].price);
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
