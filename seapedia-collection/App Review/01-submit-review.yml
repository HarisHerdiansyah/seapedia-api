info:
  name: 01-submit-review
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/{{APP_REVIEW_MODULE}}"
  body:
    type: json
    data: |-
      {
        "reviewer": "John Doe",
        "rating": 4.5,
        "content": "Aplikasi yang sangat bagus dan mudah digunakan!"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 201 Created", function() {
          expect(res.getStatus()).to.equal(201);
        });

        test("success is true", function() {
          expect(res.getBody().success).to.equal(true);
        });

        test("message is correct", function() {
          expect(res.getBody().message).to.equal("Review submitted successfully.");
        });

        test("data is null", function() {
          expect(res.getBody().data).to.be.null;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
