info:
  name: 02-submit-null-rating
  type: http
  seq: 2

http:
  method: POST
  url: "{{BASE_URL}}/{{APP_REVIEW_MODULE}}"
  body:
    type: json
    data: |-
      {
        "reviewer": "John Doe",
        "rating": null,
        "content": "Aplikasi yang bagus!"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status is 400 Bad Request", function() {
          expect(res.getStatus()).to.equal(400);
        });

        test("success is false", function() {
          expect(res.getBody().success).to.equal(false);
        });

        test("message mentions rating cannot be empty", function() {
          expect(res.getBody().message).to.include("App rating cannot be empty");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
